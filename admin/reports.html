<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>反馈管理 · TimeDrops</title><link rel="stylesheet" href="/style.css"></head>
<body><div class="site-shell"><header class="site-header"><div class="topbar"><a class="brand" href="/"><span class="brand-mark" aria-hidden="true"></span>TimeDrops</a><nav class="site-nav" aria-label="管理导航"><a aria-current="page" href="/admin/reports.html">反馈管理</a><a href="/support.html">公开支持页</a></nav></div></header>
<main class="content admin-content"><section class="page-intro"><p class="eyebrow">Private Support</p><h1>反馈管理</h1><p class="meta">本页面必须由 Cloudflare Access 保护。完整诊断仅在主动展开时读取。</p></section>
<section class="admin-toolbar" aria-label="反馈操作"><label for="report-limit">显示数量</label><select id="report-limit"><option value="25">25</option><option value="50" selected>50</option><option value="100">100</option></select><button class="button button-primary" id="refresh-reports" type="button">刷新</button><span id="admin-status" role="status" aria-live="polite"></span></section>
<section id="report-list" class="report-list" aria-label="反馈列表"></section>
<template id="report-template"><article class="legal-card report-card"><div class="report-heading"><div><span class="report-category"></span><strong class="report-id"></strong></div><time class="report-time"></time></div><p class="report-message"></p><dl class="report-meta"><div><dt>联系邮箱</dt><dd class="report-contact-email"></dd></div><div><dt>应用版本</dt><dd class="report-version"></dd></div><div><dt>诊断</dt><dd class="report-diagnostic-state"></dd></div><div><dt>到期时间</dt><dd class="report-expiry"></dd></div></dl><pre class="report-diagnostics" hidden></pre><div class="report-actions"><button class="button button-secondary report-load-diagnostics" type="button">查看诊断</button><button class="button report-delete" type="button">删除反馈</button></div></article></template>
<noscript><p class="notice">此管理页需要 JavaScript 才能读取受保护的反馈接口。</p></noscript></main>
<footer class="site-footer"><div class="footer-row"><span>TimeDrops · 私有反馈管理</span></div></footer></div><script type="module" src="/admin/reports.js"></script></body></html>
