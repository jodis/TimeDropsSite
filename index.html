  <h1>TimeDrops</h1>
  <p>把每天的照片和视频，按天整理成可回看的时光成片。</p>

  <h2>核心功能</h2>
  <ul>
    <li>创建时光集，按日期记录每日影像；</li>
    <li>每日媒体自动标准化（统一画幅、时长与编码）；</li>
    <li>一键合并生成完整视频，可加水印、日期与背景音乐；</li>
    <li>播放、导出、分享到设备内任意位置。</li>
  </ul>

  <h2>本地优先</h2>
  <p>TimeDrops 的核心功能不需要注册账号，你的照片和视频默认保存在设备本地，不会上传到任何服务器。</p>
